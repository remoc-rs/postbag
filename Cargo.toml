[package]
name = "postbag"
version = "1.0.0-pre10"
authors = [
    "Sebastian Urban <surban@surban.net>",
    "James Munns <james@onevariable.com>",
]
edition = "2024"
readme = "README.md"
homepage = "https://remoc.rs/postbag/"
repository = "https://github.com/remoc-rs/postbag"
description = "💼 Postbag is a compact binary serde codec for Rust with built-in support for schema evolution. Fields and enum variants can be added, removed and reordered while old and new programs continue to exchange data."
license = "Apache-2.0"
rust-version = "1.95"
categories = ["encoding"]
keywords = ["serde", "serialization", "binary", "schema-evolution", "codec"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
base64 = "0.23"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(postbag_fast_compile)'] }
